[package]
name = "neoq"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
sha2 = "0.10"
tracing = "*"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
neo4rs = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
